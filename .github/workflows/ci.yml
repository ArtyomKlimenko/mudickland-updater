name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build updater
        run: dotnet build src/MuDickLand.Updater/MuDickLand.Updater.csproj -c Release -p:EnableWindowsTargeting=true
      - name: Run updater core tests
        run: dotnet run --project tests/MuDickLand.Updater.Tests/MuDickLand.Updater.Tests.csproj -c Release -p:EnableWindowsTargeting=true

  test-manifest-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run manifest builder tests
        run: python -m unittest discover -s tests -p "test_*.py"
